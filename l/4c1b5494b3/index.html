<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#1B2130">
<title>TOMI · הלוח</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF0F3;--card:#fff;--ink:#1B2130;--mute:#667085;--line:#E2E5EA;--wa:#1FA855;--go:#2D5BFF;--won:#B7791F;--bad:#C2413A}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:400 16px/1.5 "Assistant",system-ui,sans-serif;padding-bottom:40px}
button,input,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px 14px 8px;max-width:640px;margin:0 auto}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
h1{font-size:24px;font-weight:800;line-height:1.2}
.sync{font-size:13px;font-weight:700;color:var(--mute);white-space:nowrap}
.sync.err{color:var(--bad)}
.search{width:100%;margin-top:10px;border:0;border-radius:12px;padding:10px 14px;background:#fff;font-size:16px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-top:10px;scrollbar-width:none;padding-bottom:2px}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;border:0;border-radius:999px;padding:7px 13px;background:#fff;font-weight:700;font-size:14.5px;cursor:pointer}
.tabs button.on{background:var(--ink);color:#fff}
.tabs b{font-weight:800;opacity:.6;margin-inline-start:4px}
main{max-width:640px;margin:0 auto;padding:4px 12px 0}
.card{background:var(--card);border-radius:18px;padding:14px;margin-top:10px}
.top{display:flex;gap:12px;align-items:center}
.top img{width:54px;height:54px;border-radius:14px;object-fit:cover;flex:none;background:var(--line)}
.top .t{min-width:0;flex:1}
.top b{font-size:18px;font-weight:800;display:block;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top small{color:var(--mute);font-size:14px}
.tag{display:inline-block;font-size:12.5px;font-weight:700;padding:1px 9px;border-radius:999px;background:var(--bg);margin-inline-end:6px}
.when{font-size:13.5px;color:var(--mute);margin-top:8px}
details{margin-top:8px}
summary{cursor:pointer;color:var(--mute);font-size:14px}
.msg{white-space:pre-wrap;background:var(--bg);border-radius:12px;padding:10px 12px;margin-top:8px;font-size:14.5px}
.note{width:100%;min-height:64px;margin-top:10px;border:1.5px solid var(--line);border-radius:12px;padding:9px 12px;font-size:15px;resize:vertical}
.note:focus{outline:none;border-color:var(--go)}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.acts a,.acts button{display:block;text-align:center;text-decoration:none;border:0;border-radius:12px;padding:11px 6px;background:var(--bg);font-weight:700;font-size:15px;cursor:pointer}
.acts .wa{background:var(--wa);color:#fff}
.acts .go{background:var(--go);color:#fff}
.acts .won{background:var(--won);color:#fff}
.acts .full{grid-column:1/-1}
.acts .soft{background:none;color:var(--mute);font-weight:600;font-size:14px;padding:6px}
.empty{text-align:center;color:var(--mute);padding:56px 20px}
.chat{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.b{max-width:86%;padding:8px 12px;border-radius:14px;font-size:15px;line-height:1.45;white-space:pre-wrap}
.b.them{align-self:flex-start;background:var(--bg)}
.b.me{align-self:flex-end;background:#DCF7C5}
.lbl{font-size:13.5px;font-weight:700;color:var(--mute);margin-top:12px}
.draft{width:100%;min-height:96px;margin-top:6px;border:2px solid var(--wa);border-radius:12px;padding:9px 12px;font-size:15px;resize:vertical}
.in{width:100%;min-height:46px;margin-top:12px;border:1.5px dashed var(--line);border-radius:12px;padding:9px 12px;font-size:15px;resize:vertical}
.addbtn{display:block;width:100%;margin-top:6px;border:0;border-radius:12px;padding:10px;background:var(--ink);color:#fff;font-weight:700;font-size:15px;cursor:pointer}
.connect{max-width:520px;margin:30px auto;background:#fff;border-radius:18px;padding:20px}
.connect h2{font-size:20px;margin-bottom:6px}
.connect p{color:var(--mute);font-size:15px}
.connect textarea{width:100%;margin-top:12px;border:1.5px solid var(--line);border-radius:12px;padding:10px;font-size:14px;min-height:70px;direction:ltr}
.connect button{margin-top:10px;width:100%;border:0;border-radius:12px;padding:12px;background:var(--ink);color:#fff;font-weight:800;font-size:16px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-weight:700;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.toast.show{opacity:1}
</style>
</head>
<body>
<div id="root"></div>
<div class="toast" id="toast"></div>
<script>
const REPO = "tomshavit7-ai/tomi-crm";
const API = "https://api.github.com/repos/" + REPO + "/contents/";
const TABS = [
  ["ready", "מוכנים"], ["sent", "נשלחו"], ["replied", "ענו"], ["won", "סגרו"], ["out", "לא רלוונטי"]
];
const OUT = {lost: "לא מעוניין", removed: "ביקש הסר", skip: "דילגתי"};
const esc = t => String(t == null ? "" : t).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));

// ---- token: once per device (from a #token=... link or pasted)
if (location.hash.startsWith("#token=")) {
  localStorage.setItem("tomi-token", decodeURIComponent(location.hash.slice(7)));
  history.replaceState(null, "", location.pathname);
}
let token = localStorage.getItem("tomi-token");

let leads = JSON.parse(localStorage.getItem("tomi-leads") || "[]");
let status = JSON.parse(localStorage.getItem("tomi-status") || "{}");
let pending = JSON.parse(localStorage.getItem("tomi-pending") || "{}");   // changes not yet saved to GitHub
let drafts = JSON.parse(localStorage.getItem("tomi-drafts") || "{}");     // reply suggestions written by the bot
let anyWaiting = false;
let sha = null, tab = "ready", query = "", saving = false, syncText = "";

function toast(t){ const el = document.getElementById("toast"); el.textContent = t; el.classList.add("show"); clearTimeout(toast.h); toast.h = setTimeout(() => el.classList.remove("show"), 1800); }
const b64 = s => btoa(String.fromCharCode(...new TextEncoder().encode(s)));
const unb64 = s => new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\n/g, "")), c => c.charCodeAt(0)));

async function gh(path, opts = {}) {
  const r = await fetch(API + path + (opts.method ? "" : "?t=" + Date.now()), {
    method: opts.method || "GET", cache: "no-store",
    headers: {Authorization: "Bearer " + token, Accept: opts.raw ? "application/vnd.github.raw+json" : "application/vnd.github+json",
              "Content-Type": "application/json"},
    body: opts.body ? JSON.stringify(opts.body) : undefined
  });
  if (r.status === 401 || r.status === 403) { throw Object.assign(new Error("auth"), {code: r.status}); }
  return r;
}
async function loadStatus() {
  const r = await gh("status.json");
  if (r.status === 404) { sha = null; return {}; }
  const j = await r.json(); sha = j.sha;
  return JSON.parse(unb64(j.content) || "{}");
}
async function refresh() {
  if (!token) return render();
  setSync("טוען…");
  try {
    const r = await gh("leads.json", {raw: true});
    if (r.ok) { leads = await r.json(); localStorage.setItem("tomi-leads", JSON.stringify(leads)); }
    const rd = await gh("drafts.json", {raw: true});
    if (rd.ok) { drafts = await rd.json(); localStorage.setItem("tomi-drafts", JSON.stringify(drafts)); }
    const remote = await loadStatus();
    status = Object.assign(remote, pending);
    localStorage.setItem("tomi-status", JSON.stringify(status));
    setSync(Object.keys(pending).length ? "שומר…" : "מעודכן ✓");
    if (Object.keys(pending).length) save();
  } catch (e) {
    if (e.message === "auth") { setSync("המפתח לא עובד", true); localStorage.removeItem("tomi-token"); token = null; }
    else setSync("אין חיבור, השינויים יישמרו אחר כך", true);
  }
  render();
}
async function save() {
  if (saving || !token) return; saving = true; setSync("שומר…");
  try {
    for (let i = 0; i < 4 && Object.keys(pending).length; i++) {
      const remote = await loadStatus();
      const merged = Object.assign(remote, pending);
      const sent = JSON.stringify(pending);
      const r = await gh("status.json", {method: "PUT", body: {message: "board update", content: b64(JSON.stringify(merged, null, 1)), sha: sha || undefined}});
      if (r.ok) {
        sha = (await r.json()).content.sha; status = merged;
        if (JSON.stringify(pending) === sent) pending = {};
        localStorage.setItem("tomi-pending", JSON.stringify(pending));
        localStorage.setItem("tomi-status", JSON.stringify(status));
      } else if (r.status !== 409 && r.status !== 422) throw new Error("save " + r.status);
    }
    setSync(Object.keys(pending).length ? "שומר…" : "נשמר ✓");
  } catch (e) { setSync("לא נשמר עדיין, אנסה שוב", true); setTimeout(save, 15000); }
  saving = false;
}
function setSync(t, err) { syncText = t; const el = document.getElementById("sync"); if (el) { el.textContent = t; el.classList.toggle("err", !!err); } }

function setStatus(id, s, extra = {}) {
  const cur = status[id] || {};
  const next = s ? Object.assign({}, cur, {s, t: new Date().toISOString()}, extra) : null;
  if (s === "sent" && !cur.sentAt) next.sentAt = next.t;
  if (next) { status[id] = next; pending[id] = next; } else { delete status[id]; pending[id] = {s: "ready", t: new Date().toISOString()}; }
  localStorage.setItem("tomi-pending", JSON.stringify(pending));
  localStorage.setItem("tomi-status", JSON.stringify(status));
  clearTimeout(setStatus.h); setStatus.h = setTimeout(save, 700);
}
const stOf = l => { const s = (status[l.id] || {}).s; return !s || s === "ready" ? "ready" : (OUT[s] ? "out" : s); };

function ago(iso) {
  if (!iso) return "";
  const d = new Date(iso), days = Math.floor((Date.now() - d) / 864e5);
  const date = d.getDate() + "." + (d.getMonth() + 1);
  return date + (days === 0 ? " (היום)" : days === 1 ? " (אתמול)" : " (לפני " + days + " ימים)");
}
function waLink(l, withText) {
  const n = "972" + String(l.phone || "").replace(/\D/g, "").replace(/^0/, "");
  return "https://wa.me/" + n + (withText ? "?text=" + encodeURIComponent(l.message) : "");
}

const chatOf = s => s.chat || (s.note ? [{w: "them", x: s.note, t: s.t}] : []);
function chatBlock(l, s) {
  const id = esc(l.id), chat = chatOf(s);
  let h = chat.length ? '<div class="chat">' + chat.map(m => '<p class="b ' + (m.w === "me" ? "me" : "them") + '">' + esc(m.x) + '</p>').join("") + '</div>' : "";
  const them = chat.filter(m => m.w === "them"), last = them[them.length - 1], d = drafts[l.id];
  const waitingForMe = chat.length > 0 && chat[chat.length - 1].w === "them";
  const stale = s.redo && (!d || s.redo > d.made);
  if (waitingForMe && d && d.for === last.t && !stale) {
    h += '<p class="lbl">הצעת תשובה מהבוט (אפשר לשנות לפני ששולחים):</p><textarea class="draft" data-draft="' + id + '">' + esc(d.text) + '</textarea>' +
         '<div class="acts"><a class="wa full" href="#" data-reply="' + id + '">שלח את התשובה בוואטסאפ</a>' +
         '<button class="soft full" data-redo="' + id + '">תכתוב לי תשובה אחרת</button></div>';
  } else if (waitingForMe) {
    anyWaiting = true;
    h += '<p class="lbl">⏳ הבוט כותב הצעת תשובה… (עד דקה, כשהמחשב דלוק)</p>';
  }
  h += '<textarea class="in" data-in="' + id + '" placeholder="' + (chat.length ? "הם כתבו משהו חדש? הדבק כאן" : "מה הם כתבו לך? הדבק כאן את ההודעה שלהם") + '"></textarea>' +
       '<button class="addbtn" data-add="' + id + '">הוסף, והבוט יציע תשובה</button>';
  return h;
}

function card(l) {
  const st = stOf(l), s = status[l.id] || {};
  let h = '<article class="card" id="' + esc(l.id) + '"><div class="top"><img src="' + esc(l.thumb) + '" alt="" onerror="this.style.visibility=\'hidden\'">' +
    '<div class="t"><b>' + esc(l.name) + '</b><small><span class="tag">' + esc(l.label || (l.kind === "food" ? "מסעדה" : "חנות")) + '</span>' +
    esc(l.city) + (l.rating ? ", " + esc(l.rating) : "") + '</small></div></div>';
  if (st === "ready") h += '<p class="when">נבנה ' + ago(l.date + "T08:00:00") + '</p>';
  if (s.sentAt) h += '<p class="when">נשלח ' + ago(s.sentAt) + (st !== "sent" ? ", עודכן " + ago(s.t) : "") + '</p>';
  if (st === "sent") {
    const days = (Date.now() - new Date(s.sentAt)) / 864e5;
    if (l.deleted) h += '<p class="when">🗑 לא ענו חודש, האתר נמחק. הבוט לא יפנה אליהם שוב.</p>';
    else if (days > 7) h += '<p class="when">🔒 לא ענו שבוע, אז הקישור נסגר. אם יענו, לחץ "ענה לי" והוא ייפתח שוב.</p>';
    else h += '<p class="when">הקישור ייסגר בעוד ' + Math.max(1, Math.ceil(7 - days)) + ' ימים אם לא יענו.</p>';
  }
  if (st === "out") h += '<p class="when">' + OUT[s.s] + (l.deleted ? '. 🗑 האתר נמחק (עבר שבוע). הבוט לא יפנה אליהם שוב.'
                          : '. 🔒 הקישור לאתר נסגר. אם לא תחזיר אותו תוך שבוע, הוא יימחק.') + '</p>';
  if (st === "replied" || st === "won") h += chatBlock(l, s);
  if (st === "won" || st === "out" && s.s === "lost")
    h += '<textarea class="note" data-note="' + esc(l.id) + '" placeholder="הערות: מחיר שסגרתם, מה ביקש לשנות… (נשמר לבד)">' + esc(s.note || "") + '</textarea>';
  if (st === "ready") h += '<details><summary>ההודעה</summary><div class="msg">' + esc(l.message) + '</div></details>';
  h += '<div class="acts">';
  if (st === "ready") {
    h += '<a href="' + esc(l.site) + '" target="_blank" rel="noopener">צפה באתר</a>' +
         '<a class="wa" href="' + esc(waLink(l, true)) + '" data-sent="' + esc(l.id) + '">שלח בוואטסאפ</a>' +
         '<button class="soft full" data-set="skip" data-id="' + esc(l.id) + '">לא מתאים לי, דלג</button>';
  } else if (st === "sent") {
    h += '<button class="go" data-set="replied" data-id="' + esc(l.id) + '">ענה לי 💬</button>' +
         '<a href="' + esc(l.site) + '" target="_blank" rel="noopener">צפה באתר</a>' +
         '<button class="soft" data-set="removed" data-id="' + esc(l.id) + '">ביקש הסר</button>' +
         '<button class="soft" data-set="ready" data-id="' + esc(l.id) + '">לא שלחתי בעצם</button>';
  } else if (st === "replied") {
    h += '<a class="wa" href="' + esc(waLink(l, false)) + '">המשך בצ\'אט</a>' +
         '<a href="tel:' + esc(l.phone) + '">התקשר</a>' +
         '<button class="won" data-set="won" data-id="' + esc(l.id) + '">סגר עסקה 💰</button>' +
         '<button data-set="lost" data-id="' + esc(l.id) + '">לא מעוניין</button>';
  } else if (st === "won") {
    h += '<a class="wa" href="' + esc(waLink(l, false)) + '">לצ\'אט</a><a href="' + esc(l.site) + '" target="_blank" rel="noopener">האתר</a>' +
         '<button class="soft full" data-set="replied" data-id="' + esc(l.id) + '">החזר ל"ענו"</button>';
  } else if (!l.deleted) {
    h += '<button class="full" data-set="' + (s.sentAt ? "sent" : "ready") + '" data-id="' + esc(l.id) + '">החזר ופתח שוב</button>';
  }
  return h + '</div></article>';
}

function render() {
  const root = document.getElementById("root");
  if (!token) {
    root.innerHTML = '<div class="connect"><h2>חיבור הלוח</h2><p>פעם אחת בכל מכשיר: מדביקים כאן את המפתח מ-GitHub, ואז כל מה שתסמן (נשלח, ענה, סגר) נשמר בגיבוי ומופיע בכל מקום.</p>' +
      '<textarea id="tok" placeholder="github_pat_..."></textarea><button id="saveTok">חבר</button></div>';
    return;
  }
  anyWaiting = false;
  const counts = {}; TABS.forEach(([k]) => counts[k] = 0);
  leads.forEach(l => counts[stOf(l)]++);
  const q = query.trim().toLowerCase();
  let show = q ? leads.filter(l => (l.name + " " + l.city + " " + (l.label || "")).toLowerCase().includes(q)) : leads.filter(l => stOf(l) === tab);
  if (!q && tab !== "ready") show.sort((a, b) => ((status[b.id] || {}).t || "").localeCompare((status[a.id] || {}).t || ""));
  const empty = {ready: "אין כרגע עסקים מוכנים. הבוט ממלא את הרשימה כשהמחשב דלוק.", sent: "עוד לא שלחת לאף עסק.",
                 replied: "כשמישהו עונה לך בוואטסאפ, תמצא אותו ב\"נשלחו\" ותלחץ \"ענה לי\".", won: "עוד אין עסקאות. זה יגיע 🙂", out: "אין כאן אף עסק."};
  root.innerHTML = '<header><div class="row"><h1>הלוח</h1><span class="sync" id="sync">' + esc(syncText) + '</span></div>' +
    '<input class="search" id="q" type="search" placeholder="חיפוש לפי שם או עיר" value="' + esc(query) + '">' +
    '<div class="tabs">' + TABS.map(([k, n]) => '<button data-tab="' + k + '"' + (!q && tab === k ? ' class="on"' : '') + '>' + n + '<b>' + counts[k] + '</b></button>').join("") + '</div></header>' +
    '<main>' + (show.length ? show.map(card).join("") : '<p class="empty">' + (q ? "לא נמצא עסק בשם הזה." : empty[tab]) + '</p>') + '</main>';
  if (q) { const el = document.getElementById("q"); el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
}

document.addEventListener("click", e => {
  const t = e.target.closest("[data-tab],[data-set],[data-sent],[data-add],[data-reply],[data-redo],#saveTok"); if (!t) return;
  if (t.dataset.add) {
    const id = t.dataset.add, box = document.querySelector('[data-in="' + id + '"]'), x = box.value.trim();
    if (!x) { box.focus(); return; }
    addChat(id, {w: "them", x, t: new Date().toISOString()});
    toast("נוסף. הבוט כותב תשובה…"); render(); return;
  }
  if (t.dataset.reply) {
    const id = t.dataset.reply, l = leads.find(v => v.id === id);
    const x = document.querySelector('[data-draft="' + id + '"]').value.trim();
    t.href = waLink(l, false) + "?text=" + encodeURIComponent(x);    // the link itself opens WhatsApp
    addChat(id, {w: "me", x, t: new Date().toISOString()});
    setTimeout(render, 800); return;
  }
  if (t.dataset.redo) {
    const id = t.dataset.redo;
    status[id] = Object.assign({}, status[id] || {}, {redo: new Date().toISOString()}); pending[id] = status[id];
    localStorage.setItem("tomi-pending", JSON.stringify(pending));
    save(); toast("מבקש תשובה אחרת…"); render(); return;
  }
  if (t.id === "saveTok") { const v = document.getElementById("tok").value.trim(); if (v) { token = v; localStorage.setItem("tomi-token", v); refresh(); } return; }
  if (t.dataset.tab) { tab = t.dataset.tab; query = ""; render(); scrollTo(0, 0); return; }
  if (t.dataset.sent) { setStatus(t.dataset.sent, "sent"); setTimeout(render, 800); return; }   // the link itself opens WhatsApp
  if (t.dataset.set) {
    const s = t.dataset.set;
    setStatus(t.dataset.id, s === "ready" ? null : s);
    toast({replied: "עבר ל\"ענו\"", won: "כל הכבוד! 💰", lost: "עבר ל\"לא רלוונטי\"", removed: "לא יקבל הודעה שוב", skip: "דילגת", sent: "הוחזר", ready: "הוחזר למוכנים"}[s] || "עודכן");
    render();
  }
});
document.addEventListener("input", e => {
  if (e.target.id === "q") { query = e.target.value; render(); return; }
  if (e.target.dataset.note) {
    const id = e.target.dataset.note, cur = status[id] || {};
    status[id] = Object.assign({}, cur, {note: e.target.value}); pending[id] = status[id];
    localStorage.setItem("tomi-pending", JSON.stringify(pending));
    clearTimeout(setStatus.h); setStatus.h = setTimeout(save, 1200);
  }
});
function addChat(id, msg) {
  const cur = status[id] || {};
  status[id] = Object.assign({}, cur, {chat: chatOf(cur).concat([msg])});
  if (msg.w === "them" && (!cur.s || cur.s === "ready" || cur.s === "sent")) status[id].s = "replied";
  pending[id] = status[id];
  localStorage.setItem("tomi-pending", JSON.stringify(pending));
  localStorage.setItem("tomi-status", JSON.stringify(status));
  save();
}
document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
// while a reply suggestion is being written, check for it every 20 s (not while typing)
setInterval(() => { if (anyWaiting && !document.hidden && !(document.activeElement && document.activeElement.tagName === "TEXTAREA")) refresh(); }, 20000);
render(); refresh();
</script>
