<style>
:root{ --bg:#F3F5F0;--ink:#22331F;--accent:#B8436A;--second:#8DB07A;--display:"Bellefair",serif;--on-accent:#fff; }
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:400 17px/1.6 "Assistant",system-ui,sans-serif;padding-bottom:calc(86px + env(safe-area-inset-bottom))}

ul{list-style:none}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:6px}

.ribbon{background:var(--ink);color:var(--bg);font-size:13px;line-height:1.4;text-align:center;padding:7px 16px}

/* hero: the business's own photo, its name set as large as the width allows */

.hero__logo{width:58px;height:58px;border-radius:50%;object-fit:cover;border:2px solid rgba(255,255,255,.85);margin-bottom:14px;background:#fff}
.hero__name{display:inline-block;font-family:var(--display);font-weight:400;line-height:.98;white-space:nowrap;font-size:64px;letter-spacing:-.005em}

}
h += '</main>';
h += '<footer class="foot"><div>© ' + new Date().getFullYear() + ' ' + esc(S.name) + ', כל הזכויות שמורות</div><div class="by">Website by <b>TOMI</b></div></footer>';

const bar = [];
if (tel) bar.push('<a href="' + tel + '"' + (S.kind === "beauty" && !waLink ? ' class="main"' : '') + '>' + ICON.phone + 'התקשרו</a>');
if (waLink) bar.push('<a href="' + waLink + '"' + (S.kind === "beauty" ? ' class="main"' : '') + '>' + ICON.wa + 'וואטסאפ</a>');
if (S.menu && S.menu.length) bar.push('<a href="#menu">' + ICON.menu + (S.kind === "shop" ? 'מוצרים' : 'תפריט') + '</a>');
if (S.gallery && S.gallery.length) bar.push('<a href="#gallery">' + ICON.pics + 'תמונות</a>');
if (waze) bar.push('<a href="' + waze + '">' + ICON.nav + 'ניווט</a>');
if (S.order_url) bar.push('<a class="main" href="' + esc(S.order_url) + '">' + ICON.bag + 'להזמנה</a>');
h += '<nav class="bar" aria-label="פעולות מהירות">' + bar.join("") + '</nav>';

document.getElementById("app").innerHTML = h;

// fit the name to the width of the hero
const nm = document.querySelector(".hero__name");
function fit(){
  const cs = getComputedStyle(nm.parentElement);
  const box = nm.parentElement.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  nm.classList.remove("wrap");
  let size = Math.min(150, window.innerHeight * 0.16);
  nm.style.fontSize = size + "px";
  while (nm.offsetWidth > box && size > 34) { size -= 2; nm.style.fontSize = size + "px"; }
  if (nm.offsetWidth > box) { nm.classList.add("wrap"); nm.style.fontSize = "40px"; }
}
(document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(fit);
fit(); addEventListener("resize", fit);

// highlight the menu category in view
const chips = [...document.querySelectorAll(".chips a")];
if (chips.length && "IntersectionObserver" in window) {
  const io = new IntersectionObserver(es => es.forEach(e => {
    if (!e.isIntersecting) return;
    chips.forEach(a => a.classList.toggle("on", a.getAttribute("href") === "#" + e.target.id));
    const on = chips.find(a => a.classList.contains("on"));
    if (on) on.scrollIntoView({block:"nearest", inline:"center", behavior:"smooth"});
  }), {rootMargin:"-30% 0px -60% 0px"});
  document.querySelectorAll(".cat").forEach(c => io.observe(c));
}
})();
</script>
