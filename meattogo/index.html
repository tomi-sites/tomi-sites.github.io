:root{ --bg:#F1F3F6;--ink:#1C2433;--accent:#2D63C8;--second:#F0B429;--display:"Secular One",serif;--on-accent:#fff; }
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:400 17px/1.6 "Assistant",system-ui,sans-serif;padding-bottom:calc(86px + env(safe-area-inset-bottom))}
img{display:block;max-width:100%}

ul{list-style:none}

.ribbon{background:var(--ink);color:var(--bg);font-size:13px;line-height:1.4;text-align:center;padding:7px 16px}

/* hero: the business's own photo, its name set as large as the width allows */

.hero__img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2}

.hero__name{display:inline-block;font-family:var(--display);font-weight:400;line-height:.98;white-space:nowrap;font-size:64px;letter-spacing:-.005em}
.hero__name.wrap{white-space:normal}
.hero__tag{font-size:clamp(18px,4.6vw,22px);line-height:1.4;margin-top:12px;max-width:30ch;color:rgba(255,255,255,.92)}

.status.open::before{background:#5EE38B;box-shadow:0 0 0 4px rgba(94,227,139,.25)}

  .hero__name{animation:rise .9s .15s cubic-bezier(.2,.7,.2,1) both}

  @keyframes rise{from{transform:translateY(35%);opacity:0}}
}

.wrap{max-width:720px;margin:0 auto;padding:0 22px}
.facts{display:flex;flex-wrap:wrap;gap:8px 22px;padding:20px 0 4px;font-size:15.5px}

.chips::-webkit-scrollbar{display:none}
.chips a{flex:none;text-decoration:none;font-weight:700;font-size:15px;padding:7px 15px;border-radius:999px;border:1.5px solid color-mix(in srgb,var(--ink) 30%,transparent);transition:background .2s,color .2s,border-color .2s}

.cat{padding-top:18px;scroll-margin-top:64px}

.item__name{font-weight:800;font-size:17.5px;line-height:1.35}
.item__desc{font-size:15px;line-height:1.5;color:color-mix(in srgb,var(--ink) 72%,transparent);margin-top:3px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

.item img{width:100px;height:100px;flex:none;object-fit:cover;border-radius:16px;background:color-mix(in srgb,var(--second) 30%,var(--bg))}

/* beauty */

.services li{font-weight:600;font-size:16px;padding:9px 16px;border-radius:999px;background:color-mix(in srgb,var(--accent) 13%,var(--bg));border:1px solid color-mix(in srgb,var(--accent) 30%,transparent)}
.gallery{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.gallery img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:14px;background:color-mix(in srgb,var(--second) 30%,var(--bg))}
.gallery img:first-child{grid-column:1/-1;aspect-ratio:16/10}

.addr{font-size:18px;margin-bottom:14px}
.map{width:100%;height:270px;border:0;border-radius:18px;display:block;background:color-mix(in srgb,var(--second) 25%,var(--bg))}
.links{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.btn{display:inline-flex;align-items:center;gap:8px;text-decoration:none;font-weight:700;font-size:15.5px;padding:10px 18px;border-radius:999px;border:1.5px solid var(--ink)}

.foot{text-align:center;font-size:13.5px;padding:48px 22px 28px;color:color-mix(in srgb,var(--ink) 65%,transparent)}
.foot .by{direction:ltr;margin-top:4px}
.foot .by b{letter-spacing:.06em}

.bar{position:fixed;inset:auto 0 0 0;z-index:10;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:var(--ink)}

  for (const [a,b] of H[d] || []) { const end = b <= a ? b + 1440 : b; if (m >= a && m < end) return {open:true, text:"פתוח עכשיו, עד " + hm(b)}; }
  for (const [a,b] of H[(d+6)%7] || []) if (b <= a && m < b) return {open:true, text:"פתוח עכשיו, עד " + hm(b)};
  for (let i = 0; i < 7; i++) {
    const rs = (H[(d+i)%7] || []).filter(([a]) => i > 0 || a > m).sort((x,y) => x[0]-y[0]);
    if (rs.length) {
      const when = i === 0 ? "היום" : i === 1 ? "מחר" : "ביום " + DAYS[(d+i)%7];
      return {open:false, text:"סגור עכשיו, נפתח " + when + " ב-" + hm(rs[0][0])};
    }
  }
  return null;
}

const st = status();
const waLink = S.whatsapp ? "https://wa.me/972" + S.whatsapp.replace(/^0/,"") : "";
const tel = S.phone ? "tel:" + S.phone.replace(/[^\d+]/g,"") : "";
const waze = S.lat ? "https://waze.com/ul?ll=" + S.lat + "," + S.lon + "&navigate=yes" : "";
const gmaps = S.lat ? "https://www.google.com/maps/search/?api=1&query=" + S.lat + "," + S.lon : "";
let h = "";

h += '<p class="ribbon">אתר הדגמה ש-TOMI הכינו עבור ' + esc(S.name) + '</p>';
h += '<header class="hero">' + (S.cover ? '<img class="hero__img" src="' + esc(S.cover) + '" alt="" fetchpriority="high">' : '') +
     '<div class="hero__text">' + (S.logo ? '<img class="hero__logo" src="' + esc(S.logo) + '" alt="">' : '') +
     '<h1 class="hero__name">' + esc(S.name) + '</h1>' +
     (S.tagline ? '<p class="hero__tag">' + esc(S.tagline) + '</p>' : '') +
     (st ? '<p class="status' + (st.open ? ' open' : '') + '">' + esc(st.text) + '</p>' : '') +
     '</div></header>';

h += '<main class="wrap">';
const facts = [];
if (S.rating && S.rating.score) facts.push('<span>דירוג <b>' + esc(S.rating.score) + '</b> ב' + esc(S.rating.src) + (S.rating.count ? ', ' + esc(S.rating.count) + ' מדרגים' : '') + '</span>');
if (S.address) facts.push('<span>' + esc(S.address) + '</span>');
if (facts.length) h += '<div class="facts">' + facts.join("") + '</div>';
if (S.about) h += '<section class="about"><p>' + esc(S.about) + '</p></section>';

if (S.menu && S.menu.length) {
  h += '<section id="menu"><h2>' + esc(S.menu_title || "התפריט") + '</h2><nav class="chips" aria-label="קטגוריות">' +
       S.menu.map((c,i) => '<a href="#c' + i + '">' + esc(c.name) + '</a>').join("") + '</nav>';
  S.menu.forEach((c,i) => {
    h += '<div class="cat" id="c' + i + '"><h3>' + esc(c.name) + '</h3><ul>';
    for (const it of c.items) {
      h += '<li class="item"><div class="item__txt"><div class="item__name">' + esc(it.name) + '</div>' +
           (it.desc ? '<p class="item__desc">' + esc(it.desc) + '</p>' : '') +
           '<span class="item__price">' + esc(String(it.price).replace(/\.0+$/,"")) + ' ₪</span></div>' +
           (it.img ? '<img loading="lazy" src="' + esc(it.img) + '?w=360" alt="' + esc(it.name) + '" onerror="this.remove()">' : '') + '</li>';
    }
    h += '</ul></div>';
  });
  h += '</section>';
}
if (S.services && S.services.length)
  h += '<section id="services"><h2>הטיפולים שלנו</h2><ul class="services">' + S.services.map(s => '<li>' + esc(s) + '</li>').join("") + '</ul></section>';
if (S.gallery && S.gallery.length)
  h += '<section id="gallery"><h2>מהסטודיו</h2><div class="gallery">' + S.gallery.map(g => '<img loading="lazy" src="' + esc(g) + '" alt="" onerror="this.remove()">').join("") + '</div></section>';

if (S.hours) {
  const today = nowIL().d;
  h += '<section id="hours"><h2>שעות פתיחה</h2><ul class="hours">' + DAYS.map((name,i) => {
    const r = S.hours[i] || [];
    return '<li' + (i === today ? ' class="today"' : '') + '><span>יום ' + name + '</span><span>' +
      (r.length ? r.map(([a,b]) => hm(a) + "–" + hm(b)).join(", ") : "סגור") + '</span></li>';
  }).join("") + '</ul></section>';
}
if (S.lat) {
  h += '<section id="where"><h2>איך מגיעים</h2>' + (S.address ? '<p class="addr">' + esc(S.address) + '</p>' : '') +
       '<iframe class="map" loading="lazy" title="מפה" src="https://maps.google.com/maps?q=' + S.lat + ',' + S.lon + '&z=16&hl=iw&output=embed"></iframe>' +
       '<div class="links"><a class="btn" href="' + waze + '">' + ICON.nav + 'ניווט ב-Waze</a><a class="btn" href="' + gmaps + '">Google Maps</a></div></section>';
}
h += '</main>';
h += '<footer class="foot"><div>© ' + new Date().getFullYear() + ' ' + esc(S.name) + ', כל הזכויות שמורות</div><div class="by">Website by <b>TOMI</b></div></footer>';

const bar = [];
if (tel) bar.push('<a href="' + tel + '"' + (S.kind === "beauty" && !waLink ? ' class="main"' : '') + '>' + ICON.phone + 'התקשרו</a>');
if (waLink) bar.push('<a href="' + waLink + '"' + (S.kind === "beauty" ? ' class="main"' : '') + '>' + ICON.wa + 'וואטסאפ</a>');
if (S.menu && S.menu.length) bar.push('<a href="#menu">' + ICON.menu + (S.kind === "shop" ? 'מוצרים' : 'תפריט') + '</a>');
if (S.gallery && S.gallery.length) bar.push('<a href="#gallery">' + ICON.pics + 'תמונות</a>');
if (waze) bar.push('<a href="' + waze + '">' + ICON.nav + 'ניווט</a>');
if (S.order_url) bar.push('<a class="main" href="' + esc(S.order_url) + '">' + ICON.bag + 'להזמנה</a>');
h += '<nav class="bar" aria-label="פעולות מהירות">' + bar.join("") + '</nav>';

document.getElementById("app").innerHTML = h;

// fit the name to the width of the hero
const nm = document.querySelector(".hero__name");
function fit(){
  const cs = getComputedStyle(nm.parentElement);
  const box = nm.parentElement.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  nm.classList.remove("wrap");
  let size = Math.min(150, window.innerHeight * 0.16);
  nm.style.fontSize = size + "px";
  while (nm.offsetWidth > box && size > 34) { size -= 2; nm.style.fontSize = size + "px"; }
  if (nm.offsetWidth > box) { nm.classList.add("wrap"); nm.style.fontSize = "40px"; }
}
(document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(fit);
fit(); addEventListener("resize", fit);

// highlight the menu category in view
const chips = [...document.querySelectorAll(".chips a")];
if (chips.length && "IntersectionObserver" in window) {
  const io = new IntersectionObserver(es => es.forEach(e => {
    if (!e.isIntersecting) return;
    chips.forEach(a => a.classList.toggle("on", a.getAttribute("href") === "#" + e.target.id));
    const on = chips.find(a => a.classList.contains("on"));
    if (on) on.scrollIntoView({block:"nearest", inline:"center", behavior:"smooth"});
  }), {rootMargin:"-30% 0px -60% 0px"});
  document.querySelectorAll(".cat").forEach(c => io.observe(c));
}
})();
</script>
</body>
</html>
